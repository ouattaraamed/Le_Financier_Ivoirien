<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Actualités — Le Financier Ivoirien</title>
  <meta name="description" content="Les dernières actualités économiques et financières publiées par Le Financier Ivoirien.">
  <link rel="icon" href="/favicon.ico?v=20261027" sizes="any">
  <link rel="icon" href="/favicon-48.png?v=20261027" type="image/png" sizes="48x48">
  <link rel="icon" href="/icon-192.png?v=20261027" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261027" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://lefinancierivoirien.com/actualites">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=20261102black">
</head>
<body>
  <div id="site-chrome"></div>
  <script src="js/site.js?v=20261104trafic"></script>

  <main>
    <section class="articles-section">
      <div class="articles-header">
        <h2>Actualités</h2>
        <span class="articles-count" id="newsCount">—</span>
      </div>
      <div class="articles-grid" id="newsList" aria-busy="true"></div>
    </section>
  </main>

  <footer>
  <nav class="footer-links" aria-label="Pied de page">
    <div class="footer-row"><a href="/">Accueil</a><span class="footer-sep" aria-hidden="true">|</span><a href="/a-propos">À propos</a><span class="footer-sep" aria-hidden="true">|</span><a href="/contact">Contact</a></div>
    <div class="footer-row"><a href="/mentions-legales">Mentions légales</a><span class="footer-sep" aria-hidden="true">|</span><a href="/brvm">Marchés &amp; Bourse</a><span class="footer-sep" aria-hidden="true">|</span><a href="/banques">Banques &amp; Finance</a></div>
    <div class="footer-row"><a href="/entreprises">Entreprises</a><span class="footer-sep" aria-hidden="true">|</span><a href="/economie">Économie</a><span class="footer-sep" aria-hidden="true">|</span><a href="/afrique">Afrique &amp; International</a></div>
    <div class="footer-row"><a href="/investissement">Investissement</a><span class="footer-sep" aria-hidden="true">|</span><a href="/actualites">Actualités</a><span class="footer-sep" aria-hidden="true">|</span><a href="/tribune">Tribune libre</a></div>
    <div class="footer-row"><a href="/etudiants">Étudiants</a><span class="footer-sep" aria-hidden="true">|</span><a href="/portraits">Portraits &amp; Interviews</a></div>
  </nav>
</footer>
  <script src="js/config.js?v=20261017b"></script>
  <script>
    (function () {
      var list = document.getElementById("newsList");
      var count = document.getElementById("newsCount");
      var url = window.LFI.supabaseUrl +
        "/rest/v1/Articles?select=id,titre,contenu,categorie,auteur,image_url,created_at&order=created_at.desc&limit=24";

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      fetch(url, {
        headers: {
          apikey: window.LFI.supabaseKey,
          Authorization: "Bearer " + window.LFI.supabaseKey
        }
      }).then(function (response) {
        if (!response.ok) {
          throw new Error("load");
        }
        return response.json();
      }).then(function (articles) {
        var rows = Array.isArray(articles) ? articles : [];
        count.textContent = String(rows.length);
        list.setAttribute("aria-busy", "false");
        if (!rows.length) {
          list.innerHTML = '<p class="lead">Aucun article dans la catégorie « Actualités ».</p>';
          return;
        }
        list.innerHTML = rows.map(function (article) {
          var date = article.created_at
            ? new Date(article.created_at).toLocaleDateString("fr-FR", {
                day: "numeric",
                month: "long",
                year: "numeric",
                timeZone: "Africa/Abidjan"
              })
            : "";
          var text = String(article.contenu || "").replace(/@@lfi-(?:images|docs)@@[\s\S]*$/, "").replace(/\s+/g, " ").trim().slice(0, 160);
          var photo = String(article.image_url || "").replace(
            "https://le-financier-ivoirien.vercel.app/",
            "https://lefinancierivoirien.com/"
          );
          var image = photo
            ? ' style="background-image:url(\'' + escapeHtml(photo) + '\'),linear-gradient(135deg,#333,#111);background-size:cover;background-position:center"'
            : "";
          return (
            '<a class="article-card" href="/article?id=' + encodeURIComponent(article.id) + '">' +
              '<div class="article-image"' + image + '></div>' +
              '<div class="article-body">' +
                '<div class="article-category">' + escapeHtml(article.categorie || "Actualités") + "</div>" +
                "<h3>" + escapeHtml(article.titre || "Sans titre") + "</h3>" +
                "<p>" + escapeHtml(text) + "</p>" +
                '<div class="meta">' + escapeHtml(article.auteur || "") +
                  (date ? " · " + escapeHtml(date) : "") + "</div>" +
              "</div>" +
            "</a>"
          );
        }).join("");
      }).catch(function () {
        count.textContent = "0";
        list.setAttribute("aria-busy", "false");
        list.innerHTML = '<p class="lead">Les actualités sont momentanément indisponibles.</p>';
      });
    })();
  </script>
</body>
</html>
