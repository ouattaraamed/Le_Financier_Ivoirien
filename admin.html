<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Administration — Le Financier Ivoirien</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f3;
      color: #10211f;
    }

    header {
      background: #063f37;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h2 {
      font-family: Georgia, serif;
      color: #063f37;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5d1;
      border-radius: 5px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      background: #063f37;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0b6657;
    }

    #loginBox {
      max-width: 500px;
      margin: 50px auto;
    }

    #adminBox {
      display: none;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }

    .logout {
      background: #8b2020;
      float: right;
      margin-top: 0;
      padding: 10px 15px;
      font-size: 13px;
    }

    .clear {
      clear: both;
    }
  </style>
</head>

<body>

<header>
  <h1>Le Financier Ivoirien</h1>
  <p>Administration</p>
</header>

<main>

  <!-- CONNEXION -->
  <div class="box" id="loginBox">

    <h2>Connexion administrateur</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        placeholder="Votre adresse e-mail"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        required
      >

      <button type="submit">
        Se connecter
      </button>

      <div id="loginMessage" class="message"></div>

    </form>
  </div>


  <!-- ADMINISTRATION -->
  <div class="box" id="adminBox">

    <button class="logout" id="logoutButton">
      Déconnexion
    </button>

    <div class="clear"></div>

    <h2>Publier un article</h2>

    <form id="articleForm">

      <label for="titre">Titre de l'article</label>

      <input
        id="titre"
        type="text"
        placeholder="Ex : La BRVM poursuit sa progression"
        required
      >


      <label for="categorie">Catégorie</label>

      <select id="categorie" required>

        <option value="">
          Choisir une catégorie
        </option>

        <option>
          Marchés & Bourse
        </option>

        <option>
          Banques & Finance
        </option>

        <option>
          Entreprises
        </option>

        <option>
          Économie ivoirienne
        </option>

        <option>
          Afrique & International
        </option>

        <option>
          Investissement
        </option>

        <option>
          Portraits & Interviews
        </option>

        <option>
          Actualités
        </option>

      </select>


      <label for="auteur">Auteur</label>

      <input
        id="auteur"
        type="text"
        placeholder="Nom de l'auteur"
        required
      >


      <label for="image_url">URL de l'image</label>

      <input
        id="image_url"
        type="url"
        placeholder="https://..."
      >


      <label for="contenu">Contenu de l'article</label>

      <textarea
        id="contenu"
        placeholder="Écrivez votre article ici..."
        required
      ></textarea>


      <button type="submit">
        Publier l'article
      </button>

      <div id="articleMessage" class="message"></div>

    </form>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xjwimhgdqcaqqadhhtnz.supabase.co";
const SUPABASE_KEY = "sb_publishable_gneCI14E-yANxMZOeBotww_K2snSohZ";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");

const loginForm = document.getElementById("loginForm");
const articleForm = document.getElementById("articleForm");

const loginMessage = document.getElementById("loginMessage");
const articleMessage = document.getElementById("articleMessage");

const logoutButton = document.getElementById("logoutButton");


function message(element, texte, success = false) {
  element.style.display = "block";
  element.textContent = texte;

  element.style.background = success ? "#dff5e9" : "#ffe3e3";
  element.style.color = success ? "#12633d" : "#9b1c1c";
}


/* Vérifier la connexion existante */

async function verifierConnexion() {

  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    loginBox.style.display = "none";
    adminBox.style.display = "block";
  } else {
    loginBox.style.display = "block";
    adminBox.style.display = "none";
  }
}


/* Connexion */

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  message(
    loginMessage,
    "Connexion en cours...",
    true
  );

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    message(
      loginMessage,
      "❌ " + error.message
    );

    return;
  }


  if (data.session) {

    loginBox.style.display = "none";
    adminBox.style.display = "block";

    loginForm.reset();

    loginMessage.style.display = "none";
  }

});


/* Publication */

articleForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  message(
    articleMessage,
    "Publication en cours...",
    true
  );


  const {
    data: { session }
  } = await supabaseClient.auth.getSession();


  if (!session) {

    message(
      articleMessage,
      "❌ Vous devez être connecté."
    );

    return;
  }


  const article = {

    titre:
      document.getElementById("titre").value.trim(),

    categorie:
      document.getElementById("categorie").value,

    auteur:
      document.getElementById("auteur").value.trim(),

    image_url:
      document.getElementById("image_url").value.trim(),

    contenu:
      document.getElementById("contenu").value.trim()

  };


  const { data, error } =
    await supabaseClient
      .from("Articles")
      .insert([article])
      .select();


  if (error) {

    console.error(error);

    message(
      articleMessage,
      "❌ " + error.message
    );

    return;
  }


  message(
    articleMessage,
    "✅ Article publié avec succès !",
    true
  );


  articleForm.reset();

});


/* Déconnexion */

logoutButton.addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  adminBox.style.display = "none";
  loginBox.style.display = "block";

});


/* Lancement */

verifierConnexion();

</script>

</body>
</html>
