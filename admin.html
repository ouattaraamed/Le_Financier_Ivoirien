<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Administration — Le Financier Ivoirien</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: #f4f6f3;
      color: #10211f;
    }

    header {
      background: #063f37;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    h2 {
      font-family: Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
      color: #063f37;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5d1;
      border-radius: 5px;
      font-size: 15px;
      font-family: Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      background: #063f37;
      color: white;
      border: 0;
      padding: 13px 20px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0b6657;
    }

    .secondary {
      background: #777;
    }

    .secondary:hover {
      background: #555;
    }

    .danger {
      background: #8b2020;
    }

    .danger:hover {
      background: #a82a2a;
    }

    .edit {
      background: #a06a00;
    }

    .edit:hover {
      background: #c08300;
    }

    #loginBox {
      max-width: 500px;
      margin: 50px auto;
    }

    #adminBox {
      display: none;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }

    .logout {
      background: #8b2020;
      float: right;
      margin-top: 0;
      padding: 10px 15px;
      font-size: 13px;
    }

    .clear {
      clear: both;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .section-title button {
      margin-top: 0;
    }

    .article-card {
      border: 1px solid #dce3df;
      border-radius: 8px;
      padding: 20px;
      margin-top: 18px;
      background: #fafcfb;
    }

    .article-card h3 {
      margin-top: 0;
      color: #063f37;
      font-family: Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
    }

    .article-meta {
      color: #66736f;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .article-preview {
      color: #394744;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .article-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .article-actions button {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #66736f;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #66736f;
    }

    @media (max-width: 600px) {
      main {
        margin: 20px auto;
        padding: 0 12px;
      }

      .box {
        padding: 20px;
      }

      header {
        padding: 20px 15px;
      }

      .article-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Le Financier Ivoirien</h1>
  <p>Administration</p>
</header>

<main>

  <!-- CONNEXION -->
  <div class="box" id="loginBox">

    <h2>Connexion administrateur</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>

      <input
        id="email"
        type="email"
        placeholder="Votre adresse e-mail"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        required
      >

      <button type="submit">
        Se connecter
      </button>

      <div id="loginMessage" class="message"></div>

    </form>
  </div>


  <!-- ADMINISTRATION -->
  <div id="adminBox">

    <!-- PUBLICATION / MODIFICATION -->
    <div class="box">

      <button class="logout" id="logoutButton">
        Déconnexion
      </button>

      <div class="clear"></div>

      <h2 id="formTitle">Publier un article</h2>

      <form id="articleForm">

        <label for="titre">Titre de l'article</label>

        <input
          id="titre"
          type="text"
          placeholder="Ex : La BRVM poursuit sa progression"
          required
        >

        <label for="categorie">Catégorie</label>

        <select id="categorie" required>

          <option value="">
            Choisir une catégorie
          </option>

          <option>Marchés & Bourse</option>
          <option>Banques & Finance</option>
          <option>Entreprises</option>
          <option>Économie</option>
          <option>Économie ivoirienne</option>
          <option>Afrique & International</option>
          <option>Investissement</option>
          <option>Portraits & Interviews</option>
          <option>Actualités</option>

        </select>

        <label for="auteur">Auteur</label>

        <input
          id="auteur"
          type="text"
          placeholder="Nom de l'auteur"
          required
        >

        <label for="image_url">URL de l'image</label>

        <input
          id="image_url"
          type="url"
          placeholder="https://..."
        >

        <label for="contenu">Contenu de l'article</label>

        <textarea
          id="contenu"
          placeholder="Écrivez votre article ici..."
          required
        ></textarea>

        <button type="submit" id="submitButton">
          Publier l'article
        </button>

        <button
          type="button"
          class="secondary"
          id="cancelEditButton"
          style="display:none;"
        >
          Annuler la modification
        </button>

        <div id="articleMessage" class="message"></div>

      </form>

    </div>


    <!-- MESSAGES REÇUS -->
    <div class="box">
      <div class="section-title">
        <h2>Messages reçus</h2>
      </div>
      <div id="messagesList" class="loading">
        Chargement des messages...
      </div>
    </div>

    <!-- LISTE DES ARTICLES -->
    <div class="box">

      <div class="section-title">

        <h2>Articles publiés</h2>

        <button type="button" id="refreshButton">
          🔄 Actualiser
        </button>

      </div>

      <div id="articlesList" class="loading">
        Chargement des articles...
      </div>

    </div>

  </div>

</main>


<script src="js/config.js?v=20261016c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = window.LFI.supabaseUrl;
const SUPABASE_KEY = window.LFI.supabaseKey;

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* Éléments */

const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

const loginForm =
  document.getElementById("loginForm");

const articleForm =
  document.getElementById("articleForm");

const loginMessage =
  document.getElementById("loginMessage");

const articleMessage =
  document.getElementById("articleMessage");

const logoutButton =
  document.getElementById("logoutButton");

const articlesList =
  document.getElementById("articlesList");

const refreshButton =
  document.getElementById("refreshButton");

const formTitle =
  document.getElementById("formTitle");

const submitButton =
  document.getElementById("submitButton");

const cancelEditButton =
  document.getElementById("cancelEditButton");


let articleEnModification = null;


/* Messages */

function message(element, texte, success = false) {

  element.style.display = "block";

  element.textContent = texte;

  element.style.background =
    success ? "#dff5e9" : "#ffe3e3";

  element.style.color =
    success ? "#12633d" : "#9b1c1c";
}


/* Vérification connexion */

async function verifierConnexion() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    loginBox.style.display = "none";
    adminBox.style.display = "block";

    chargerArticles();
    chargerMessages();

  } else {

    loginBox.style.display = "block";
    adminBox.style.display = "none";

  }
}


/* Connexion */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message(
      loginMessage,
      "Connexion en cours...",
      true
    );

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      message(
        loginMessage,
        "❌ " + error.message
      );

      return;
    }


    if (data.session) {

      loginBox.style.display = "none";
      adminBox.style.display = "block";

      loginForm.reset();

      loginMessage.style.display = "none";

      chargerArticles();
    chargerMessages();
    }

  }
);


/* Publier ou modifier */

articleForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message(
      articleMessage,
      articleEnModification
        ? "Modification en cours..."
        : "Publication en cours...",
      true
    );


    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      message(
        articleMessage,
        "❌ Vous devez être connecté."
      );

      return;
    }


    const article = {

      titre:
        document
          .getElementById("titre")
          .value
          .trim(),

      categorie:
        document
          .getElementById("categorie")
          .value,

      auteur:
        document
          .getElementById("auteur")
          .value
          .trim(),

      image_url:
        document
          .getElementById("image_url")
          .value
          .trim(),

      contenu:
        document
          .getElementById("contenu")
          .value
          .trim()

    };


    /* MODIFICATION */

    if (articleEnModification) {

      const { error } =
        await supabaseClient
          .from("Articles")
          .update(article)
          .eq("id", articleEnModification);


      if (error) {

        console.error(error);

        message(
          articleMessage,
          "❌ " + error.message
        );

        return;
      }


      message(
        articleMessage,
        "✅ Article modifié avec succès !",
        true
      );


      annulerModification();

      chargerArticles();
    chargerMessages();

      return;
    }


    /* NOUVEL ARTICLE */

    const { error } =
      await supabaseClient
        .from("Articles")
        .insert([article])
        .select();


    if (error) {

      console.error(error);

      message(
        articleMessage,
        "❌ " + error.message
      );

      return;
    }


    message(
      articleMessage,
      "✅ Article publié avec succès !",
      true
    );


    articleForm.reset();

    chargerArticles();
    chargerMessages();

  }
);


/* Charger les articles */

async function chargerArticles() {

  articlesList.innerHTML =
    '<div class="loading">Chargement des articles...</div>';


  const { data, error } =
    await supabaseClient
      .from("Articles")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    articlesList.innerHTML =
      '<div class="empty">❌ Impossible de charger les articles.</div>';

    return;
  }


  if (!data || data.length === 0) {

    articlesList.innerHTML =
      '<div class="empty">Aucun article publié.</div>';

    return;
  }


  articlesList.innerHTML = "";


  data.forEach(function(article) {

    const card =
      document.createElement("div");

    card.className =
      "article-card";


    const title =
      document.createElement("h3");

    title.textContent =
      article.titre || "Sans titre";


    const meta =
      document.createElement("div");

    meta.className =
      "article-meta";

    const date =
      article.created_at
        ? new Date(article.created_at)
            .toLocaleString("fr-FR")
        : "";

    meta.textContent =
      (article.categorie || "Sans catégorie")
      + " • "
      + (article.auteur || "Auteur inconnu")
      + (date ? " • " + date : "");


    const preview =
      document.createElement("div");

    preview.className =
      "article-preview";

    const contenu =
      article.contenu || "";

    preview.textContent =
      contenu.length > 300
        ? contenu.substring(0, 300) + "..."
        : contenu;


    const actions =
      document.createElement("div");

    actions.className =
      "article-actions";


    const editButton =
      document.createElement("button");

    editButton.className =
      "edit";

    editButton.textContent =
      "✏️ Modifier";

    editButton.addEventListener(
      "click",
      function() {
        modifierArticle(article);
      }
    );


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "danger";

    deleteButton.textContent =
      "🗑️ Supprimer";

    deleteButton.addEventListener(
      "click",
      function() {
        supprimerArticle(article.id);
      }
    );


    actions.appendChild(editButton);
    actions.appendChild(deleteButton);


    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(preview);
    card.appendChild(actions);


    articlesList.appendChild(card);

  });

}


/* Préparer modification */

function modifierArticle(article) {

  articleEnModification =
    article.id;


  document
    .getElementById("titre")
    .value =
      article.titre || "";


  document
    .getElementById("categorie")
    .value =
      article.categorie || "";


  document
    .getElementById("auteur")
    .value =
      article.auteur || "";


  document
    .getElementById("image_url")
    .value =
      article.image_url || "";


  document
    .getElementById("contenu")
    .value =
      article.contenu || "";


  formTitle.textContent =
    "Modifier l'article";


  submitButton.textContent =
    "Enregistrer les modifications";


  cancelEditButton.style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* Annuler modification */

function annulerModification() {

  articleEnModification = null;

  articleForm.reset();

  formTitle.textContent =
    "Publier un article";

  submitButton.textContent =
    "Publier l'article";

  cancelEditButton.style.display =
    "none";

  articleMessage.style.display =
    "none";

}


cancelEditButton.addEventListener(
  "click",
  annulerModification
);


/* Supprimer */

async function supprimerArticle(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer cet article ?"
    );


  if (!confirmation) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("Articles")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "❌ Impossible de supprimer l'article : "
      + error.message
    );

    return;
  }


  alert(
    "✅ Article supprimé avec succès."
  );


  chargerArticles();

}


/* Actualiser */

refreshButton.addEventListener(
  "click",
  function () {
    chargerArticles();
    chargerMessages();
  }
);


/* Déconnexion */

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    adminBox.style.display = "none";

    loginBox.style.display = "block";

  }
);


/* Messages reçus */

function echapper(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function chargerMessages() {
  const liste = document.getElementById("messagesList");
  if (!liste) {
    return;
  }
  const { data } = await supabaseClient.auth.getSession();
  const token = data.session && data.session.access_token;
  if (!token) {
    liste.textContent = "Connexion requise.";
    return;
  }
  liste.textContent = "Chargement des messages...";
  const response = await fetch("/api/messages", {
    headers: { Authorization: "Bearer " + token }
  });
  const body = await response.json().catch(function () { return {}; });
  if (!response.ok) {
    liste.textContent = body.error || "Lecture impossible.";
    return;
  }
  const messages = body.messages || [];
  if (!messages.length) {
    liste.textContent = "Aucun message pour le moment.";
    return;
  }
  liste.innerHTML = messages.map(function (item) {
    const date = item.created_at
      ? new Date(item.created_at).toLocaleString("fr-FR")
      : "";
    return (
      '<article style="border-top:1px solid #ddd;padding:14px 0">' +
        "<strong>" + echapper(item.sujet) + "</strong>" +
        '<p style="margin:6px 0;color:#52615d">' + echapper(item.nom) + " — " + echapper(item.email) +
        (date ? " — " + echapper(date) : "") + "</p>" +
        '<p style="margin:0;white-space:pre-wrap">' + echapper(item.message) + "</p>" +
      "</article>"
    );
  }).join("");
}

/* Lancement */

verifierConnexion();

</script>

</body>
</html>
