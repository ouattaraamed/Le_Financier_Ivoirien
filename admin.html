<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Administration — Le Financier Ivoirien</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #052e29;
      --green2: #0a5c4f;
      --gold: #c9a227;
      --ink: #12201e;
      --muted: #5e6e6a;
      --line: #e3e8e6;
      --paper: #f4f6f5;
      --danger: #8b2020;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--green);
      color: #fff;
      padding: 14px 4%;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
    }

    .admin-brand img {
      height: 36px;
      width: auto;
    }

    .admin-brand strong {
      display: block;
      font-size: 15px;
      letter-spacing: 0.01em;
    }

    .admin-brand span {
      display: block;
      color: #c9d7d3;
      font-size: 12px;
    }

    .admin-top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-top-actions a {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .admin-top-actions a:hover { color: var(--gold); }

    main {
      max-width: 920px;
      margin: 28px auto 48px;
      padding: 0 20px;
    }

    .box {
      background: #fff;
      border: 1px solid var(--line);
      border-top: 4px solid var(--gold);
      padding: 28px;
      margin-bottom: 18px;
    }

    h2 {
      color: var(--green);
      font-size: 22px;
      margin: 0;
    }

    .lead {
      color: var(--muted);
      margin: 8px 0 0;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d5ddd9;
      border-radius: 0;
      font: 15px/1.4 Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: #fff;
      color: var(--ink);
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--green2);
      outline-offset: 1px;
      border-color: var(--green2);
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      margin-top: 18px;
      background: var(--green);
      color: #fff;
      border: 0;
      padding: 12px 16px;
      font: 700 14px/1 Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
      cursor: pointer;
    }

    button:hover { background: var(--green2); }

    .secondary { background: #5c6764; }
    .secondary:hover { background: #3e4745; }
    .danger { background: var(--danger); }
    .danger:hover { background: #a82a2a; }
    .edit { background: #8a6414; }
    .edit:hover { background: #6e4e0d; }

    #loginBox { max-width: 460px; margin: 36px auto; }
    #adminBox { display: none; }

    .admin-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .admin-tabs button {
      margin: 0;
      background: transparent;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      padding: 12px 16px;
    }

    .admin-tabs button:hover { background: transparent; color: var(--green); }
    .admin-tabs button.is-on {
      color: var(--green);
      border-bottom-color: var(--gold);
    }

    .panel { display: none; }
    .panel.is-on { display: block; }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      display: none;
      font-size: 14px;
    }

    .logout {
      display: none;
      margin: 0;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,.35);
      padding: 8px 12px;
      font-size: 13px;
    }

    body.is-admin .logout { display: inline-block; }
    .logout:hover { background: var(--danger); border-color: var(--danger); }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .section-title button { margin-top: 0; }
    .count { color: var(--muted); font-size: 13px; font-weight: 600; }

    .article-card, .message-card {
      border: 1px solid var(--line);
      padding: 16px 16px 14px;
      margin-top: 12px;
      background: #fff;
      text-align: left;
    }

    .article-card h3, .message-card h3 {
      margin: 8px 0 6px;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.35;
    }

    .badge {
      display: inline-block;
      color: #7a3140;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .article-meta, .message-card p {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 8px;
    }

    .article-preview, .message-card .body {
      color: #394744;
      line-height: 1.5;
      white-space: pre-wrap;
      margin: 0;
    }

    .article-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .article-actions button { margin-top: 0; }

    .article-actions a.reply {
      display: inline-block;
      background: var(--green);
      color: #fff;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .article-actions a.reply:hover { background: var(--green2); }

    .empty, .loading {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .admin-top { padding: 10px 12px; gap: 8px; }
      .admin-brand { gap: 8px; min-width: 0; }
      .admin-brand img { height: 28px; }
      .admin-brand span { display: none; }
      .admin-brand strong { font-size: 13px; white-space: nowrap; }
      .admin-top-actions { gap: 6px; flex-shrink: 0; }
      .admin-top-actions a { white-space: nowrap; font-size: 12px; }
      .logout { padding: 7px 8px; font-size: 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .admin-tabs { overflow-x: auto; }
      .article-actions button, .form-actions button { width: 100%; }
      main { margin-top: 16px; padding: 0 12px; }
      .box { padding: 18px; }
    }
  </style>
</head>

<body>

<header class="admin-top">
  <a class="admin-brand" href="index.html">
    <img src="logo.png" alt="Le Financier Ivoirien">
    <div>
      <strong>Le Financier Ivoirien</strong>
      <span>Administration</span>
    </div>
  </a>
  <div class="admin-top-actions">
    <a href="index.html">Voir le site</a>
    <button type="button" class="logout" id="logoutButton">Déconnexion</button>
  </div>
</header>

<main>

  <div class="box" id="loginBox">
    <h2>Connexion</h2>
    <p class="lead">Espace réservé à la rédaction.</p>
    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" placeholder="Votre adresse e-mail" required autocomplete="username">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" placeholder="Votre mot de passe" required autocomplete="current-password">
      <button type="submit">Se connecter</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>

  <div id="adminBox">
    <nav class="admin-tabs" aria-label="Sections">
      <button type="button" class="is-on" data-panel="publish">Publier</button>
      <button type="button" data-panel="messages">Messages <span class="count" id="messagesCount"></span></button>
      <button type="button" data-panel="articles">Articles <span class="count" id="articlesCount"></span></button>
    </nav>

    <section class="box panel is-on" id="publish">
      <h2 id="formTitle">Publier un article</h2>
      <p class="lead">Le texte publié apparaît sur le site.</p>
      <form id="articleForm">
        <label for="titre">Titre de l'article</label>
        <input id="titre" type="text" placeholder="Ex : La BRVM poursuit sa progression" required>

        <div class="form-grid">
          <div>
            <label for="categorie">Catégorie</label>
            <select id="categorie" required>
              <option value="">Choisir une catégorie</option>
              <option>Marchés & Bourse</option>
              <option>Banques & Finance</option>
              <option>Entreprises</option>
              <option>Économie</option>
              <option>Économie ivoirienne</option>
              <option>Afrique & International</option>
              <option>Investissement</option>
              <option>Portraits & Interviews</option>
              <option>Actualités</option>
            </select>
          </div>
          <div>
            <label for="auteur">Auteur</label>
            <input id="auteur" type="text" placeholder="Nom de l'auteur" required>
          </div>
        </div>

        <label for="image_url">URL de l'image</label>
        <input id="image_url" type="url" placeholder="https://...">

        <label for="contenu">Contenu de l'article</label>
        <textarea id="contenu" placeholder="Écrivez votre article ici..." required></textarea>

        <div class="form-actions">
          <button type="submit" id="submitButton">Publier l'article</button>
          <button type="button" class="secondary" id="cancelEditButton" style="display:none;">Annuler</button>
        </div>
        <div id="articleMessage" class="message"></div>
      </form>
    </section>

    <section class="box panel" id="messages">
      <div class="section-title">
        <h2>Messages reçus</h2>
      </div>
      <div id="messagesList" class="loading">Chargement des messages...</div>
    </section>

    <section class="box panel" id="articles">
      <div class="section-title">
        <h2>Articles publiés</h2>
        <button type="button" id="refreshButton">Actualiser</button>
      </div>
      <div id="articlesList" class="loading">Chargement des articles...</div>
    </section>
  </div>

</main>


<script src="js/config.js?v=20261016c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = window.LFI.supabaseUrl;
const SUPABASE_KEY = window.LFI.supabaseKey;

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* Éléments */

const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

function reglerSession(ouvert) {
  document.body.classList.toggle("is-admin", ouvert);
  loginBox.style.display = ouvert ? "none" : "block";
  adminBox.style.display = ouvert ? "block" : "none";
}

function montrerPanneau(id) {
  document.querySelectorAll(".admin-tabs button").forEach(function (button) {
    button.classList.toggle("is-on", button.dataset.panel === id);
  });
  document.querySelectorAll(".panel").forEach(function (panel) {
    panel.classList.toggle("is-on", panel.id === id);
  });
}

document.querySelectorAll(".admin-tabs button").forEach(function (button) {
  button.addEventListener("click", function () {
    montrerPanneau(button.dataset.panel);
  });
});

const loginForm =
  document.getElementById("loginForm");

const articleForm =
  document.getElementById("articleForm");

const loginMessage =
  document.getElementById("loginMessage");

const articleMessage =
  document.getElementById("articleMessage");

const logoutButton =
  document.getElementById("logoutButton");

const articlesList =
  document.getElementById("articlesList");

const refreshButton =
  document.getElementById("refreshButton");

const formTitle =
  document.getElementById("formTitle");

const submitButton =
  document.getElementById("submitButton");

const cancelEditButton =
  document.getElementById("cancelEditButton");


let articleEnModification = null;


/* Messages */

function message(element, texte, success = false) {

  element.style.display = "block";

  element.textContent = texte;

  element.style.background =
    success ? "#dff5e9" : "#ffe3e3";

  element.style.color =
    success ? "#12633d" : "#9b1c1c";
}


/* Vérification connexion */

async function verifierConnexion() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    reglerSession(true);

    chargerArticles();
    chargerMessages();

  } else {

    reglerSession(false);

  }
}


/* Connexion */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message(
      loginMessage,
      "Connexion en cours...",
      true
    );

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      message(
        loginMessage,
        "❌ " + error.message
      );

      return;
    }


    if (data.session) {

      reglerSession(true);

      loginForm.reset();

      loginMessage.style.display = "none";

      chargerArticles();
    chargerMessages();
    }

  }
);


/* Publier ou modifier */

articleForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message(
      articleMessage,
      articleEnModification
        ? "Modification en cours..."
        : "Publication en cours...",
      true
    );


    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      message(
        articleMessage,
        "❌ Vous devez être connecté."
      );

      return;
    }


    const article = {

      titre:
        document
          .getElementById("titre")
          .value
          .trim(),

      categorie:
        document
          .getElementById("categorie")
          .value,

      auteur:
        document
          .getElementById("auteur")
          .value
          .trim(),

      image_url:
        document
          .getElementById("image_url")
          .value
          .trim(),

      contenu:
        document
          .getElementById("contenu")
          .value
          .trim()

    };


    /* MODIFICATION */

    if (articleEnModification) {

      const { error } =
        await supabaseClient
          .from("Articles")
          .update(article)
          .eq("id", articleEnModification);


      if (error) {

        console.error(error);

        message(
          articleMessage,
          "❌ " + error.message
        );

        return;
      }


      message(
        articleMessage,
        "✅ Article modifié avec succès !",
        true
      );


      annulerModification();

      chargerArticles();
    chargerMessages();

      return;
    }


    /* NOUVEL ARTICLE */

    const { error } =
      await supabaseClient
        .from("Articles")
        .insert([article])
        .select();


    if (error) {

      console.error(error);

      message(
        articleMessage,
        "❌ " + error.message
      );

      return;
    }


    message(
      articleMessage,
      "✅ Article publié avec succès !",
      true
    );


    articleForm.reset();

    chargerArticles();
    chargerMessages();

  }
);


/* Charger les articles */

async function chargerArticles() {

  articlesList.innerHTML =
    '<div class="loading">Chargement des articles...</div>';


  const { data, error } =
    await supabaseClient
      .from("Articles")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    articlesList.innerHTML =
      '<div class="empty">Impossible de charger les articles.</div>';

    return;
  }


  if (!data || data.length === 0) {

    articlesList.innerHTML =
      '<div class="empty">Aucun article publié.</div>';
    const vide = document.getElementById("articlesCount");
    if (vide) vide.textContent = "";

    return;
  }


  articlesList.innerHTML = "";
  const compte = document.getElementById("articlesCount");
  if (compte) {
    compte.textContent = "(" + data.length + ")";
  }


  data.forEach(function(article) {

    const card =
      document.createElement("div");

    card.className =
      "article-card";


    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = article.categorie || "Sans catégorie";

    const title = document.createElement("h3");
    title.textContent = article.titre || "Sans titre";

    const meta = document.createElement("div");
    meta.className = "article-meta";
    const date = article.created_at
      ? new Date(article.created_at).toLocaleString("fr-FR")
      : "";
    meta.textContent = (article.auteur || "Auteur inconnu") + (date ? " · " + date : "");


    const preview =
      document.createElement("div");

    preview.className =
      "article-preview";

    const contenu =
      article.contenu || "";

    preview.textContent =
      contenu.length > 300
        ? contenu.substring(0, 300) + "..."
        : contenu;


    const actions =
      document.createElement("div");

    actions.className =
      "article-actions";


    const editButton =
      document.createElement("button");

    editButton.className =
      "edit";

    editButton.textContent = "Modifier";

    editButton.addEventListener(
      "click",
      function() {
        modifierArticle(article);
      }
    );


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "danger";

    deleteButton.textContent = "Supprimer";

    deleteButton.addEventListener(
      "click",
      function() {
        supprimerArticle(article.id);
      }
    );


    actions.appendChild(editButton);
    actions.appendChild(deleteButton);


    card.appendChild(badge);
    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(preview);
    card.appendChild(actions);


    articlesList.appendChild(card);

  });

}


/* Préparer modification */

function modifierArticle(article) {

  articleEnModification =
    article.id;


  document
    .getElementById("titre")
    .value =
      article.titre || "";


  document
    .getElementById("categorie")
    .value =
      article.categorie || "";


  document
    .getElementById("auteur")
    .value =
      article.auteur || "";


  document
    .getElementById("image_url")
    .value =
      article.image_url || "";


  document
    .getElementById("contenu")
    .value =
      article.contenu || "";


  formTitle.textContent = "Modifier l'article";
  submitButton.textContent = "Enregistrer les modifications";
  cancelEditButton.style.display = "inline-block";
  montrerPanneau("publish");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* Annuler modification */

function annulerModification() {

  articleEnModification = null;

  articleForm.reset();

  formTitle.textContent =
    "Publier un article";

  submitButton.textContent =
    "Publier l'article";

  cancelEditButton.style.display =
    "none";

  articleMessage.style.display =
    "none";

}


cancelEditButton.addEventListener(
  "click",
  annulerModification
);


/* Supprimer */

async function supprimerArticle(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer cet article ?"
    );


  if (!confirmation) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("Articles")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "❌ Impossible de supprimer l'article : "
      + error.message
    );

    return;
  }


  alert(
    "✅ Article supprimé avec succès."
  );


  chargerArticles();

}


/* Actualiser */

refreshButton.addEventListener(
  "click",
  function () {
    chargerArticles();
    chargerMessages();
  }
);


/* Déconnexion */

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    reglerSession(false);

  }
);


/* Messages reçus */

function echapper(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function chargerMessages() {
  const liste = document.getElementById("messagesList");
  if (!liste) {
    return;
  }
  const { data } = await supabaseClient.auth.getSession();
  const token = data.session && data.session.access_token;
  if (!token) {
    liste.textContent = "Connexion requise.";
    return;
  }
  liste.textContent = "Chargement des messages...";
  const response = await fetch("/api/messages", {
    headers: { Authorization: "Bearer " + token }
  });
  const body = await response.json().catch(function () { return {}; });
  if (!response.ok) {
    liste.textContent = body.error || "Lecture impossible.";
    return;
  }
  const messages = body.messages || [];
  if (!messages.length) {
    liste.textContent = "Aucun message pour le moment.";
    const vide = document.getElementById("messagesCount");
    if (vide) vide.textContent = "";
    return;
  }
  liste.innerHTML = messages.map(function (item) {
    const date = item.created_at
      ? new Date(item.created_at).toLocaleString("fr-FR")
      : "";
    const reply = "mailto:" + encodeURIComponent(item.email) + "?subject=" + encodeURIComponent("Re : " + (item.sujet || ""));
    return (
      '<article class="message-card">' +
        '<div class="badge">Contact</div>' +
        "<h3>" + echapper(item.sujet) + "</h3>" +
        "<p>" + echapper(item.nom) + " · " + echapper(item.email) + (date ? " · " + echapper(date) : "") + "</p>" +
        '<p class="body">' + echapper(item.message) + "</p>" +
        '<div class="article-actions"><a class="reply" href="' + reply + '">Répondre</a></div>' +
      "</article>"
    );
  }).join("");
  const compte = document.getElementById("messagesCount");
  if (compte) {
    compte.textContent = "(" + messages.length + ")";
  }
}

/* Lancement */

verifierConnexion();

</script>

</body>
</html>
