<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tribune libre — Le Financier Ivoirien</title>
  <meta name="description" content="Tribunes signées par des auteurs extérieurs à la rédaction : avis de banquiers, d’analystes, d’entrepreneurs et d’étudiants sur l’économie ivoirienne.">
  <link rel="icon" href="/favicon.ico?v=20261027" sizes="any">
  <link rel="icon" href="/favicon-48.png?v=20261027" type="image/png" sizes="48x48">
  <link rel="icon" href="/icon-192.png?v=20261027" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261027" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://lefinancierivoirien.com/tribune">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=20261020nowrap">
</head>
<body>
  <div id="site-chrome"></div>
  <script src="js/site.js?v=20261020a"></script>

  <main>
    <section class="articles-section">
      <header class="portraits-head">
        <p class="portraits-kicker">Avis signés</p>
        <h1>Tribune libre</h1>
        <p class="portraits-lead">
          Des textes signés par leurs auteurs : banquiers, analystes, entrepreneurs, enseignants et étudiants.
          Chaque tribune est un avis. La rédaction la publie sans la reprendre à son compte.
          Pour en proposer une, <a href="/contact">écrivez-nous</a>.
        </p>
      </header>
      <div class="articles-header">
        <h2>Tribunes</h2>
        <span class="articles-count" id="tribuneCount">—</span>
      </div>
      <div class="articles-grid" id="tribuneList" aria-busy="true"></div>
    </section>
  </main>

  <footer></footer>
  <script src="js/config.js?v=20261017b"></script>
  <script>
    (function () {
      var list = document.getElementById("tribuneList");
      var count = document.getElementById("tribuneCount");
      var url = window.LFI.supabaseUrl +
        "/rest/v1/Articles?select=id,titre,contenu,categorie,auteur,image_url,created_at&categorie=eq." +
        encodeURIComponent("Tribune libre") +
        "&order=created_at.desc&limit=24";

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      fetch(url, {
        headers: {
          apikey: window.LFI.supabaseKey,
          Authorization: "Bearer " + window.LFI.supabaseKey
        }
      }).then(function (response) {
        if (!response.ok) {
          throw new Error("load");
        }
        return response.json();
      }).then(function (articles) {
        var rows = Array.isArray(articles) ? articles : [];
        count.textContent = String(rows.length);
        list.setAttribute("aria-busy", "false");
        if (!rows.length) {
          list.innerHTML = '<p class="lead">Aucune tribune pour le moment. Les textes publiés ici porteront le nom de leur auteur.</p>';
          return;
        }
        list.innerHTML = rows.map(function (article) {
          var date = article.created_at
            ? new Date(article.created_at).toLocaleDateString("fr-FR", {
                day: "numeric",
                month: "long",
                year: "numeric",
                timeZone: "Africa/Abidjan"
              })
            : "";
          var text = String(article.contenu || "").replace(/@@lfi-(?:images|docs)@@[\s\S]*$/, "").replace(/\s+/g, " ").trim().slice(0, 160);
          var image = article.image_url
            ? ' style="background-image:url(\'' + escapeHtml(article.image_url) + '\')"'
            : "";
          return (
            '<a class="article-card" href="/article?id=' + encodeURIComponent(article.id) + '">' +
              '<div class="article-image"' + image + '></div>' +
              '<div class="article-body">' +
                '<div class="article-category">Tribune</div>' +
                "<h3>" + escapeHtml(article.titre || "Sans titre") + "</h3>" +
                "<p>" + escapeHtml(text) + "</p>" +
                '<div class="meta">' + escapeHtml(article.auteur || "Auteur") +
                  (date ? " · " + escapeHtml(date) : "") + "</div>" +
              "</div>" +
            "</a>"
          );
        }).join("");
      }).catch(function () {
        count.textContent = "0";
        list.setAttribute("aria-busy", "false");
        list.innerHTML = '<p class="lead">Les tribunes sont momentanément indisponibles.</p>';
      });
    })();
  </script>
</body>
</html>
